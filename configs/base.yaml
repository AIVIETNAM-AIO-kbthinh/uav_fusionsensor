# Siêu tham số dùng chung cho MỌI cấu hình của ma trận thí nghiệm.
# Bất kỳ khác biệt nào giữa các nhánh đều phải nằm ở configs/experiments/, không ở đây.
# Chỉ được chứa khoá hợp lệ của Ultralytics.

model: yolo11s-obb.yaml   # chỗ giữ chỗ; kiến trúc thật do src/models/build.py dựng
task: obb
mode: train

epochs: 60
patience: 100
batch: 8                  # BẮT BUỘC bằng nhau ở mọi cấu hình — xem plan.md 6.4
nbs: 32                   # gradient accumulate -> effective batch bằng nhau
imgsz: 640
cache: false
workers: 8
amp: true
deterministic: true

optimizer: SGD
lr0: 0.01
lrf: 0.01
cos_lr: true
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0

# --- augmentation ---------------------------------------------------------
# HSV và Albumentations tắt cho MỌI cấu hình.
#
# Lý do: cả `RandomHSV` lẫn `Albumentations` của Ultralytics đều TỰ BỎ QUA ảnh
# khác 3 kênh (`if img.shape[-1] != 3: return`). Chúng không báo lỗi, nhưng nghĩa
# là S1/S2 (3 kênh) được augment màu còn F1 (4 kênh) và C1/C2/F2 (6 kênh) thì
# không -> chênh lệch bị quy nhầm cho fusion. Xem plan.md 6.4.
#
# Albumentations được Ultralytics bật NGẦM ĐỊNH chỉ cần package có mặt trong môi
# trường (Blur, MedianBlur, ToGray, CLAHE mỗi cái p=0.01), không phụ thuộc hyp
# nào. Truyền danh sách rỗng là cách tắt sạch và tường minh.
hsv_h: 0.0
hsv_s: 0.0
hsv_v: 0.0
augmentations: []
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
close_mosaic: 10
mixup: 0.0
cutmix: 0.0
copy_paste: 0.0
erasing: 0.0

val: true
plots: false
save_period: -1
verbose: true
